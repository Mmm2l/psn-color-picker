<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختر لون البروفايل</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .picker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 3px solid #ffffff;
      border-radius: 50%;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007aff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active { background-color: #0056b3; }
  </style>
</head>
<body>
  <div class="picker-container">
    <h2>اختر لون البروفايل 🎨</h2>
    <input type="color" id="colorPicker" value="#003791">
    <button onclick="sendColor()">تأكيد اللون</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function sendColor() {
      const selectedColor = document.getElementById('colorPicker').value;
      tg.sendData(selectedColor);
    }
  </script>
</body>
</html>
