<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختر لون البروفايل</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    button {
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #0088cc;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,136,204,0.3);
    }
    button:active {
      transform: scale(0.96);
      background-color: #006699;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>اختر لون البروفايل 🎨</h2>
    <input type="color" id="colorPicker" value="#003791">
    <button type="button" id="submitBtn">تأكيد اللون</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    // تهيئة الواجهة داخل تليجرام
    tg.ready();
    tg.expand();

    const colorPicker = document.getElementById('colorPicker');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', function() {
      const selectedColor = colorPicker.value;
      
      // إرسال البيانات للبوت
      tg.sendData(selectedColor);
      
      // إغلاق النافذة فوراً
      tg.close();
    });
  </script>
</body>
</html>
