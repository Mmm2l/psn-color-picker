<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PS HUB — منتقي الألوان</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0a0e15;
    --blue:#2ea6ff;
    --blue-soft:#7dd3ff;
    --chrome:#eef2f6;
    --muted:#5b6675;
    --ring-glow: 46,166,255;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 50% 18%, rgba(46,166,255,0.14), transparent 55%),
      var(--bg);
    color:var(--chrome);
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding:24px;
  }

  .eyebrow{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:.45em;
    font-size:11px;
    color:var(--blue-soft);
    text-transform:uppercase;
    margin:0 0 6px;
    opacity:.85;
  }

  h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:.03em;
    margin:0 0 38px;
    text-align:center;
    background:linear-gradient(180deg,#ffffff 0%, #cfe6ff 45%, var(--blue) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(46,166,255,0.35));
  }

  /* ── العنصر المميز: حلقة مقتبسة من شعار PS HUB، تتوهج بلون الاختيار الحالي ── */
  .ring-wrap{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:40px;
  }

  .ring-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    animation: spin 22s linear infinite;
    filter: drop-shadow(0 0 10px rgba(var(--ring-glow), .55));
    transition: filter .25s ease;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ring-wrap .pulse{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(var(--ring-glow), .35), transparent 70%);
    animation: pulse 2.6s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes pulse{
    0%,100%{ opacity:.55; transform:scale(.94); }
    50%{ opacity:1; transform:scale(1.04); }
  }

  input[type="color"]{
    -webkit-appearance:none;
    appearance:none;
    border:none;
    width:148px;
    height:148px;
    border-radius:50%;
    cursor:pointer;
    background:none;
    position:relative;
    z-index:2;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:0; border-radius:50%; }
  input[type="color"]::-webkit-color-swatch{
    border:3px solid rgba(255,255,255,.85);
    border-radius:50%;
    box-shadow:
      0 0 0 6px rgba(0,0,0,.6),
      0 10px 30px rgba(0,0,0,.55);
  }
  input[type="color"]::-moz-color-swatch{
    border:3px solid rgba(255,255,255,.85);
    border-radius:50%;
  }

  /* ── منطقة كود اللون: قابلة للتحديد والنسخ ── */
  .hex-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:-14px 0 30px;
  }

  .hex-readout{
    font-family:'Orbitron', sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--blue-soft);
    min-height:16px;
    background:rgba(46,166,255,0.08);
    border:1px solid rgba(46,166,255,0.35);
    border-radius:8px;
    padding:8px 14px;
    /* السماح بتحديد ونسخ النص فقط داخل هذا العنصر */
    user-select:all;
    -webkit-user-select:all;
    -moz-user-select:all;
    cursor:text;
    direction:ltr;
  }

  .copy-btn{
    appearance:none;
    border:1px solid rgba(46,166,255,0.35);
    outline:none;
    cursor:pointer;
    background:rgba(46,166,255,0.08);
    color:var(--blue-soft);
    border-radius:8px;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, transform .1s ease;
  }
  .copy-btn svg{ width:16px; height:16px; }
  .copy-btn:active{ transform:scale(.92); }
  .copy-btn.copied{
    background:rgba(46,166,255,0.35);
    color:#031018;
  }

  .btn{
    appearance:none;
    border:none;
    outline:none;
    cursor:pointer;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.04em;
    color:#031018;
    padding:14px 46px;
    border-radius:14px;
    background:linear-gradient(180deg, var(--blue-soft), var(--blue));
    box-shadow:
      0 0 0 1px rgba(46,166,255,.5) inset,
      0 8px 24px rgba(46,166,255,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{
    transform:scale(.96);
    box-shadow:
      0 0 0 1px rgba(46,166,255,.6) inset,
      0 4px 14px rgba(46,166,255,.3);
  }

  .credit{
    position:absolute;
    bottom:22px;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    opacity:.8;
    transition:opacity .15s ease;
  }
  .credit:active{ opacity:1; }

  .credit svg{ width:15px; height:15px; flex:none; }

  .credit .label{
    font-family:'Orbitron', sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.16em;
    color:var(--muted);
  }
  .credit .label b{
    color:var(--blue-soft);
    font-weight:800;
  }

  @media (prefers-reduced-motion: reduce){
    .ring-wrap svg{ animation:none; }
    .ring-wrap .pulse{ animation:none; }
  }

  /* ── تنبيه احتياطي عند فشل النسخ التلقائي ── */
  .toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(12px);
    background:rgba(10,14,21,0.96);
    border:1px solid rgba(46,166,255,0.4);
    color:var(--chrome);
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 18px;
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
    z-index:10;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <p class="eyebrow">PS HUB · TOOLS</p>
  <h1>اختر لون البروفايل</h1>

  <div class="ring-wrap" id="ringWrap">
    <div class="pulse"></div>
    <svg viewBox="0 0 220 220" fill="none">
      <circle cx="110" cy="110" r="103" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-dasharray="55 30" opacity="0.9"/>
      <circle cx="110" cy="110" r="90" stroke="var(--blue-soft)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="18 14" opacity="0.55" transform="rotate(35 110 110)"/>
    </svg>
    <input type="color" id="colorPicker" value="#2EA6FF">
  </div>

  <div class="hex-row">
    <span class="hex-readout" id="hexReadout">#2EA6FF</span>
    <button class="copy-btn" id="copyBtn" title="نسخ الكود" aria-label="نسخ الكود">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>

  <button class="btn" id="submitBtn">تأكيد اللون</button>

  <div class="toast" id="toast"></div>

  <a class="credit" href="https://t.me/Y33ME" id="creditLink">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21.5 3.5L2.75 10.9c-1.15.46-1.14 1.1-.2 1.39l4.8 1.5 1.85 5.66c.22.6.37.84.78.84.37 0 .53-.17.73-.37l1.98-1.9 4.14 3.05c.76.42 1.31.2 1.5-.7l2.73-12.7c.28-1.16-.44-1.68-1.61-1.17z" fill="currentColor" style="color:var(--blue-soft)"/>
    </svg>
    <span class="label">PS HUB × <b>@Y33ME</b></span>
  </a>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
  if (tg.setHeaderColor) { try { tg.setHeaderColor('#000000'); } catch(e){} }

  const picker = document.getElementById('colorPicker');
  const readout = document.getElementById('hexReadout');
  const ringWrap = document.getElementById('ringWrap');
  const submitBtn = document.getElementById('submitBtn');
  const creditLink = document.getElementById('creditLink');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');

  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function selectReadoutText(){
    const range = document.createRange();
    range.selectNodeContents(readout);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return sel;
  }

  function syncGlow(hex){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    ringWrap.style.setProperty('--ring-glow', `${r},${g},${b}`);
    readout.textContent = hex.toUpperCase();
  }
  syncGlow(picker.value);
  picker.addEventListener('input', () => syncGlow(picker.value));

  // نسخ كود اللون عبر الزر — 3 طبقات: Clipboard API ← execCommand ← تنبيه للنسخ اليدوي
  copyBtn.addEventListener('click', async function(){
    const hex = readout.textContent;
    let copied = false;

    // الطبقة 1: Clipboard API الحديث
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try{
        await navigator.clipboard.writeText(hex);
        copied = true;
      }catch(e){ copied = false; }
    }

    // الطبقة 2: execCommand القديم (يرجع true/false فعليًا)
    if (!copied) {
      try{
        selectReadoutText();
        copied = document.execCommand('copy');
        window.getSelection().removeAllRanges();
      }catch(e){ copied = false; }
    }

    if (copied) {
      copyBtn.classList.add('copied');
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      setTimeout(() => copyBtn.classList.remove('copied'), 900);
    } else {
      // الطبقة 3: فشل النسخ التلقائي بالكامل — نحدد النص ونوجّه المستخدم للنسخ اليدوي
      selectReadoutText();
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      showToast('تم تحديد الكود — اضغط مطولاً وانسخه يدويًا');
    }
  });

  // النقر على النص نفسه يحدده تلقائياً أيضاً (احتياطي بجانب user-select:all)
  readout.addEventListener('click', selectReadoutText);

  submitBtn.addEventListener('click', function() {
    const selectedColor = picker.value;
    tg.switchInlineQuery(selectedColor);
    setTimeout(() => { tg.close(); }, 150);
  });

  // فتح رابط الحقوق داخل تيليجرام نفسه بدل متصفح خارجي
  creditLink.addEventListener('click', function(e){
    e.preventDefault();
    if (tg.openTelegramLink) tg.openTelegramLink('https://t.me/Y33ME');
    else window.open('https://t.me/Y33ME', '_blank');
  });
</script>
</body>
</html>
